    lesson: "아무것도 없을 때 큰 숫자를 말로 먼저 내걸고, 그걸 맞추려고 움직임",
    video: { title: "Masayoshi Son SoftBank 창업 이야기 (YouTube 검색)", url: "https://www.youtube.com/results?search_query=Masayoshi+Son+SoftBank+founding+story" }
  }
];

// 나중에 질문을 바꾸고 싶으면 여기만 고치면 됨
const QUESTION = "이 사람의 시작에서 내가 당장 따라할 수 있는 한 줄은?";

const app = document.getElementById("app");
const DAY = 86400000;
const dayNum = d => Math.floor(new Date(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
// 시작일: 이 날부터 하루에 한 명씩 열림 (그 전 날짜는 비어있음)
const START = new Date(2026, 8, 29);
const personIdx = d => ((dayNum(d) - dayNum(START)) % STORIES.length + STORIES.length) % STORIES.length;
const today = new Date();
const hasNote = idx => { try { return !!localStorage.getItem("note:" + STORIES[idx].name); } catch (e) { return false; } };

// 스트릭: 앱을 연 날짜를 기록해서 연속 일수를 셈
function loadVisits() { try { return JSON.parse(localStorage.getItem("visits") || "[]"); } catch (e) { return []; } }
function recordVisit() {
  const v = loadVisits(), n = dayNum(today);
  if (!v.includes(n)) { v.push(n); try { localStorage.setItem("visits", JSON.stringify(v)); } catch (e) {} }
  return new Set(v.concat(n));
}
function streaks(set) {
  let cur = 0; for (let n = dayNum(today); set.has(n); n--) cur++;
  let best = 0, run = 0, prev = null;
  [...set].sort((a, b) => a - b).forEach(n => { run = prev !== null && n === prev + 1 ? run + 1 : 1; prev = n; best = Math.max(best, run); });
  return { cur, best, total: set.size };
}

let viewMonth = new Date(today.getFullYear(), today.getMonth(), 1);
let keyHandler = null;
document.addEventListener("keydown", e => keyHandler && keyHandler(e));

function renderHome() {
  keyHandler = null;
  const st = streaks(recordVisit());
  const t = personIdx(today), ts = STORIES[t];
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let cells = "";
  for (let i = 0; i < first; i++) cells += '<div class="day empty"></div>';
  for (let d = 1; d <= days; d++) {
    const date = new Date(y, m, d), n = dayNum(date);
    if (n < dayNum(START) || n > dayNum(today)) { cells += `<div class="day">${d}</div>`; continue; } // 시작 전, 미래
    const idx = personIdx(date);
    cells += `<div class="day open ${n === dayNum(today) ? "today" : ""}" data-idx="${idx}">${hasNote(idx) ? '<span class="dot"></span>' : ""}${d}<span class="nm">${STORIES[idx].name}</span></div>`;
  }
  app.innerHTML = `
    <div class="head"><h1 class="home-title">Daily Billionaire</h1><div class="streak">Streak <b>${st.cur}</b></div></div>
    <div class="date">${today.getFullYear()}.${today.getMonth() + 1}.${today.getDate()}</div>
    <div class="hero" data-idx="${t}">
      <div class="label">TODAY</div>
      <h2>${ts.name}</h2>
      <div class="meta">${ts.year} · ${ts.age}<br>${ts.item}</div>
      <div class="go">Read story →</div>
    </div>
    <div class="sec"><span>Calendar</span>
      <span><button id="pm">‹</button>${y}.${String(m + 1).padStart(2, "0")}<button id="nm">›</button></span></div>
    <div class="dow">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(c => `<div>${c}</div>`).join("")}</div>
    <div class="cal">${cells}</div>
    <div class="sec"><span>Collection</span><span>${STORIES.length}</span></div>
    <div class="grid">${STORIES.map((s, i) => `<div class="gcard" data-idx="${i}"><div class="no">${String(i + 1).padStart(2, "0")}</div><div class="nm">${s.name}</div><div class="it">${s.item}</div></div>`).join("")}</div>
  `;
  app.querySelectorAll("[data-idx]").forEach(el => el.onclick = () => { location.hash = "#/s/" + el.dataset.idx; });
  document.getElementById("pm").onclick = () => { viewMonth = new Date(y, m - 1, 1); renderHome(); };
  document.getElementById("nm").onclick = () => { viewMonth = new Date(y, m + 1, 1); renderHome(); };
}

function renderStory(idx) {
  const s = STORIES[idx];
  const inner = (label, text) => `<div class="label">${label}</div><div class="text">${text}</div>`;
  const card = (label, text) => `<div>${inner(label, text)}</div>`;
  // 카드 순서: 표지 → 그때 → 아이디어 → 시작 → 초기 → 성장 → 지금 → 영상 → 교훈 → 내 메모
  const slides = [
    `<div class="cover"><div class="label">TODAY'S BILLIONAIRE</div>
       <h1>${s.name}</h1>
       <div class="meta">${s.year} · ${s.age}<br>${s.place}</div>
       <div class="item">${s.item}</div></div>`,
    card("THEN", s.when),
    card("IDEA", s.idea),
    ...s.start.map((t, i) => card(`START ${i + 1}/${s.start.length}`, t)),
    ...s.early.map((t, i) => card(`FIRST TRACTION ${i + 1}/${s.early.length}`, t)),
    card("GROWTH", s.growth),
    card("NOW", s.now),
    card("VIDEO", `<a href="${s.video.url}" target="_blank" rel="noopener">▶ ${s.video.title}</a>`),
    `<div class="lesson">${inner("TAKEAWAY", s.lesson)}</div>`,
    `<div>${inner("MY NOTE", "")}<textarea id="note" placeholder="${QUESTION}"></textarea><div class="saved" id="saved"></div></div>`
  ];
  app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← Home</button><button class="notebtn" id="notebtn">My Note</button></div>
    <div class="bar"><div id="progress"></div></div>
    <div class="track" id="track">${slides.map(h => `<div class="slide">${h}</div>`).join("")}</div>
    <div class="nav"><button id="prev">‹</button><span id="count"></span><button id="next">›</button></div>`;
  document.getElementById("back").onclick = () => { location.hash = "#/"; };
  const notebtn = document.getElementById("notebtn");
  notebtn.classList.toggle("has", hasNote(idx));

  const track = document.getElementById("track");
  const els = [...track.children];
  const step = () => els[0].offsetWidth + 12;
  const cur = () => Math.round(track.scrollLeft / step());
  const go = i => track.scrollTo({ left: Math.max(0, Math.min(els.length - 1, i)) * step(), behavior: "smooth" });
  const update = () => {
    const i = cur();
    document.getElementById("count").textContent = `${i + 1} / ${els.length}`;
    document.getElementById("progress").style.width = ((i + 1) / els.length * 100) + "%";
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === els.length - 1;
  };
  track.addEventListener("scroll", update);
  document.getElementById("prev").onclick = () => go(cur() - 1);
  document.getElementById("next").onclick = () => go(cur() + 1);
  els.forEach(el => el.addEventListener("click", e => { // 링크·메모칸은 제외
    if (e.target.closest("a, textarea")) return;
    go(cur() === els.length - 1 ? 0 : cur() + 1);
  }));
  keyHandler = e => {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowRight") go(cur() + 1);
    if (e.key === "ArrowLeft") go(cur() - 1);
  };
  notebtn.onclick = () => go(els.length - 1); // 메모 카드(맨 끝)로 바로 이동
  update();

  // 내 메모: 사람별로 브라우저에 자동 저장
  const note = document.getElementById("note"), saved = document.getElementById("saved"), key = "note:" + s.name;
  try { note.value = localStorage.getItem(key) || ""; } catch (e) {}
  note.addEventListener("input", () => {
    try { localStorage.setItem(key, note.value); saved.textContent = "Saved"; notebtn.classList.toggle("has", !!note.value); } catch (e) { saved.textContent = "저장 안 됨(브라우저 설정 확인)"; }
  });
}

function route() {
  const m = location.hash.match(/^#\/s\/(\d+)$/);
  window.scrollTo(0, 0);
  if (m && STORIES[+m[1]]) renderStory(+m[1]); else renderHome();
}
window.addEventListener("hashchange", route);
route();

</script>
</body>
</html>
